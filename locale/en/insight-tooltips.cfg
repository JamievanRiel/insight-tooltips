[mod-name]
insight-tooltips=Insight Tooltips

[mod-description]
insight-tooltips=Adds the numbers the vanilla tooltips leave out: when a mining drill runs dry, how many items an inserter really moves, how fast a chest fills up or empties, when your accumulators run out and how close the next productivity bonus is.

[mod-setting-name]
insight-tooltips-drills=Mining drills
insight-tooltips-inserters=Inserters
insight-tooltips-crafters=Crafting machines
insight-tooltips-containers=Chests and cargo wagons
insight-tooltips-poles=Electric poles
insight-tooltips-update-interval=Update interval (ticks)

[mod-setting-description]
insight-tooltips-drills=Show the output including speed and productivity bonuses, and when the resources under the drill run out.
insight-tooltips-inserters=Show the chest-to-chest throughput. Picking up from belts is slower.
insight-tooltips-crafters=Show the progress towards the next free craft from productivity.
insight-tooltips-containers=Show the number of items stored and, measured while you hover, how fast the container fills up or empties.
insight-tooltips-poles=Show when the accumulators of the network are full or empty.
insight-tooltips-update-interval=How often the numbers of a hovered entity are refreshed. 60 ticks is one second.

